[project]
name = "habit-tracker"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = "^3.14"
dependencies = [
    "django (<6.1)",
    "djangorestframework (>=3.18.3,<4.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "celery (>=5.7.0,<6.0.0)",
    "redis (>=8.2.0,<9.0.0)",
    "django-celery-beat (>=2.9.0,<3.0.0)",
    "drf-yasg (>=1.21.18,<2.0.0)",
    "coverage (>=7.17.5,<8.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.5.0,<8.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "isort (>=9.0.2,<10.0.0)"
]

[tool.black]
# Максимальная длина строки
line-length = 119
# Файлы, которые не нужно форматировать
exclude = '''
(
  /(
      \.eggs         # исключаем лишнее
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | venv         # папка вашего виртуального окружения
  )/
)
'''


[tool.isort]
# максимальная длина строки
line_length = 119
profile = "black"

[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*",
    "*\\migrations\\*",
    "*/tests.py",
    "*\\tests.py",
    "*/tests/*",
    "*\\tests\\*",
    "*/__init__.py",
    "*\\__init__.py",
    "manage.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
